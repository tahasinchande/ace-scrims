<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#090A0F"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.6"/>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="aceBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="aceBrandGradSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(56, 56) scale(10)" filter="url(#glow)">
    <!-- Left Dynamic Wing / Geometric Apex -->
    <path d="M6 32 L20 6 L26 18 L16 32 Z" fill="url(#aceBrandGrad)" />
    <!-- Right Dynamic Wing / Forward Thrust -->
    <path d="M20 6 L34 32 L24 32 L17 18 Z" fill="url(#aceBrandGradSub)" />
    <!-- Central Diamond Core -->
    <path d="M20 12 L24 20 L20 28 L16 20 Z" fill="#ffffff" opacity="0.98" />
  </g>
</svg>